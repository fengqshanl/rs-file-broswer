name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

# Publishing is macOS-only for now. The Windows/Linux matrix entries were
# removed on purpose; re-add them here and a rule in
# scripts/build-updater-manifest.mjs to publish those platforms again.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Read desktop version
        id: version
        run: |
          version="$(node -p "require('./desktop/local/tauri.conf.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A signing key is optional. Without it the release still contains the
      # macOS .dmg and users still see the "new version" prompt; only the
      # one-click in-app update channel is unavailable.
      - name: Check updater signing key
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 TAURI_SIGNING_PRIVATE_KEY，本次发布不含应用内热更新包"
          fi

      # Validate the key once, up front, instead of discovering a problem after
      # two 12-minute macOS builds. Two things are checked:
      #   1. the key can actually sign (correct password, valid format)
      #   2. its key ID matches the pubkey compiled into both apps
      # Point 2 is what makes the difference between "update downloads" and
      # "update installs": the updater rejects a signature from another key.
      # Every failure path names what the secret actually contained, because
      # the secret itself can never be inspected from the outside.
      - name: Preflight updater signing key
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          key_path="${RUNNER_TEMP}/agentgod-updater.key"

          material_line="$(node scripts/normalize-updater-key.mjs --classify)"
          material="${material_line%% *}"
          if [ -n "${SIGNING_PASSWORD:-}" ]; then
            password_state="已配置"
          else
            password_state="未配置"
          fi
          echo "::notice::签名材料类型=${material}，密码=${password_state}"

          if ! node scripts/normalize-updater-key.mjs "$key_path"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 内容有问题（类型=${material}），见上方说明"
            exit 1
          fi

          cli_version="$(npx --yes @tauri-apps/cli@2 --version 2>&1 | tail -n 1)"
          echo "::notice::使用 ${cli_version}"

          preflight="${RUNNER_TEMP}/preflight.bin"
          printf 'agentgod updater signing preflight\n' > "$preflight"
          sign_log="${RUNNER_TEMP}/updater-sign.log"
          if ! npx --yes @tauri-apps/cli@2 signer sign \
                --private-key-path "$key_path" \
                --password "${SIGNING_PASSWORD:-}" \
                "$preflight" > "$sign_log" 2>&1; then
            detail="$(grep -m1 -E 'Error|error|failed' "$sign_log" 2>/dev/null | sed 's/^[[:space:]]*//' | cut -c1-300 || true)"
            echo "::error::更新签名私钥无法使用（材料=${material}，密码=${password_state}）：${detail:-签名器无输出}"
            echo '----- signer output -----'
            tail -n 20 "$sign_log" || true
            exit 1
          fi

          node scripts/verify-updater-signature.mjs \
            "$preflight" "${preflight}.sig" desktop/local/tauri.conf.json || {
            echo "::error::私钥与 desktop/local/tauri.conf.json 的 pubkey 不匹配"
            exit 1
          }
          node scripts/verify-updater-signature.mjs \
            "$preflight" "${preflight}.sig" desktop/client/tauri.conf.json || {
            echo "::error::私钥与 desktop/client/tauri.conf.json 的 pubkey 不匹配"
            exit 1
          }

      - name: Create or reuse release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="desktop-v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "AgentGod Files 桌面版 v${VERSION}" \
              --notes-file .github/desktop-release-notes.md
          fi
          gh release view "$tag" --json databaseId --jq .databaseId

      # Releases built before the macOS-only switch still carry Windows/Linux
      # installers. Users must never pick one of those, so clean every release
      # on each publish (the operation is idempotent).
      - name: Prune non-macOS installers from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r tag id name; do
            [ -n "${id:-}" ] || continue
            echo "::notice::deleting $tag/$name"
            gh api -X DELETE "repos/$REPO/releases/assets/$id" >/dev/null
          done < <(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq '.[] | .tag_name as $tag | .assets[] | select(.name | test("\\.(AppImage|deb|exe|msi)$"; "i")) | "\($tag)\t\(.id)\t\(.name)"')

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: [local, client]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/${{ matrix.app }}

      # The bundler reads TAURI_SIGNING_PRIVATE_KEY as either key contents or a
      # file path. A path keeps the secret out of the environment of every
      # child process. The password variable is always exported (empty when no
      # password is configured) so signing never waits for terminal input.
      - name: Normalize updater signing env
        if: needs.prepare.outputs.signing == 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/agentgod-updater.key"
          node scripts/normalize-updater-key.mjs "$key_path"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<AGENTGOD_EOF"
            printf '%s\n' "${SIGNING_PASSWORD:-}"
            echo "AGENTGOD_EOF"
          } >> "$GITHUB_ENV"

      # Tauri 2 emits .app.tar.gz / .app.tar.gz.sig when this flag is on and a
      # private key is present. Do NOT add `updater` to --bundles: it is not a
      # bundle target and makes the build fail.
      - name: Enable signed updater artifacts
        if: needs.prepare.outputs.signing == 'true'
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='desktop/${{ matrix.app }}/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          echo "updater artifacts enabled for ${{ matrix.app }} (macOS)"

      # No releaseId/tagName on purpose: the action only builds. Uploading is
      # done below with deterministic ASCII asset names, which keeps one
      # updater bundle per app and lets the manifest job match assets exactly.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/${{ matrix.app }}
          retryAttempts: 3
          includeUpdaterJson: false
          args: --target universal-apple-darwin

      - name: Upload macOS installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          case "$APP" in
            local) product="AgentGod.Files.Local" ;;
            client) product="AgentGod.Files.Client" ;;
            *) echo "::error::未知应用 ${APP}"; exit 1 ;;
          esac
          dmg_dir="desktop/${APP}/target/universal-apple-darwin/release/bundle/dmg"
          dmg="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' | sort | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "::error::没有找到 macOS 安装包（$dmg_dir）"
            exit 1
          fi
          upload="${RUNNER_TEMP}/${product}_${VERSION}_universal.dmg"
          cp "$dmg" "$upload"
          gh release upload "desktop-v${VERSION}" "$upload" --clobber
          echo "::notice::uploaded $(basename "$upload")"

      # Verify the exact bytes users will download against the pubkey compiled
      # into the app before publishing them.
      - name: Verify and upload updater bundle
        if: needs.prepare.outputs.signing == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          case "$APP" in
            local) product="AgentGod.Files.Local" ;;
            client) product="AgentGod.Files.Client" ;;
            *) echo "::error::未知应用 ${APP}"; exit 1 ;;
          esac
          app_dir="desktop/${APP}"
          macos_dir="${app_dir}/target/universal-apple-darwin/release/bundle/macos"
          bundle="$(find "$macos_dir" -maxdepth 1 -type f -name '*.app.tar.gz' | sort | head -n 1)"
          if [ -z "$bundle" ] || [ ! -f "${bundle}.sig" ]; then
            echo "::error::签名密钥已生效但没有产出 .app.tar.gz / .sig；请检查 createUpdaterArtifacts 与构建日志"
            exit 1
          fi
          node scripts/verify-updater-signature.mjs "$bundle" "${bundle}.sig" "${app_dir}/tauri.conf.json"

          upload="${RUNNER_TEMP}/${product}_${VERSION}_universal.app.tar.gz"
          cp "$bundle" "$upload"
          cp "${bundle}.sig" "${upload}.sig"
          gh release upload "desktop-v${VERSION}" "$upload" "${upload}.sig" --clobber
          echo "::notice::uploaded $(basename "$upload") and its signature"

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test manifest builder
        run: node scripts/build-updater-manifest.mjs --self-test

      - name: Publish updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: desktop-v${{ needs.prepare.outputs.version }}
          EXPECT_SIGNED: ${{ needs.prepare.outputs.signing == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          OUTPUT_DIR=.update-manifests \
            node scripts/build-updater-manifest.mjs
          for file in .update-manifests/latest-local.json .update-manifests/latest-client.json; do
            if [ -f "$file" ]; then
              gh release upload "$RELEASE_TAG" "$file" --clobber
              echo "uploaded $(basename "$file")"
            fi
          done
