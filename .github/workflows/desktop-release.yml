name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

# Only macOS installers are published for now. Linux and Windows were dropped
# from the matrix because their updater bundles kept breaking the release; the
# code paths are kept so those platforms can be re-enabled later.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read desktop version
        id: version
        run: |
          version="$(node -p "require('./desktop/local/tauri.conf.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="desktop-v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "AgentGod Files 桌面版 v${VERSION}" \
              --notes-file .github/desktop-release-notes.md
          fi
          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: [local, client]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/${{ matrix.app }}

      # A signing key is optional. Without it the release still contains the
      # macOS .dmg; only the silent in-app updater channel is disabled.
      - name: Check updater signing key
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            # A common mistake is pasting the public key or adding quotes.
            # Validate the base64 payload before the builds start.
            if ! node -e "
              const raw = (process.env.SIGNING_KEY || '').trim();
              const decoded = Buffer.from(raw.replace(/\s+/g, ''), 'base64').toString('utf8');
              const valid = raw.includes('encrypted secret key') || decoded.includes('encrypted secret key');
              process.exit(valid ? 0 : 1);
            "; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY 不是有效的 Tauri 更新签名私钥（应为 ~/.tauri/agentgod-files.key 的原始内容或 base64），请重新复制"
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 TAURI_SIGNING_PRIVATE_KEY，本次发布不含应用内热更新包"
          fi

      # tauri-cli accepts the raw key contents or a path to the key file, but
      # NOT a base64 string. Secrets are often pasted base64-encoded, so decode
      # when needed and always point the CLI at a real file. An empty password
      # variable can also break the bundler, so only pass it when set.
      - name: Normalize updater signing env
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/agentgod-updater.key"
          KEY_PATH="$key_path" node -e '
            const fs = require("fs");
            const raw = (process.env.SIGNING_KEY || "").trim();
            const decoded = Buffer.from(raw.replace(/\s+/g, ""), "base64").toString("utf8");
            const content = decoded.includes("encrypted secret key") ? decoded : raw;
            fs.writeFileSync(process.env.KEY_PATH, `${content.trimEnd()}\n`, { mode: 0o600 });
          '
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
          if [ -n "${SIGNING_PASSWORD:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "signing key written to $key_path"

      # Tauri 2 generates .app.tar.gz / .app.tar.gz.sig when this flag is set
      # and TAURI_SIGNING_PRIVATE_KEY is present. Do NOT pass `--bundles
      # updater`: updater is not a bundle target and makes the build fail.
      - name: Enable signed updater artifacts
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='desktop/${{ matrix.app }}/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          echo "updater artifacts enabled for ${{ matrix.app }} (macOS)"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing variables come from $GITHUB_ENV (normalized above).
        with:
          projectPath: desktop/${{ matrix.app }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          retryAttempts: 3
          # Both apps share one Release; a single latest.json would overwrite
          # itself. We generate latest-local.json / latest-client.json below.
          includeUpdaterJson: false
          args: --target universal-apple-darwin

      # Make sure the signed updater bundle and its .sig reach the Release even
      # when the action itself does not publish those extra artifacts.
      - name: Upload signed updater bundle
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-v${{ needs.prepare.outputs.version }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          root="${GITHUB_WORKSPACE:-.}"
          sigs=()
          while IFS= read -r sig; do
            [ -z "$sig" ] || sigs+=("$sig")
          done < <(find "$root" -type f -name '*.sig' 2>/dev/null | sort)
          count=${#sigs[@]}
          echo "::notice::found $count signature file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::签名密钥已生效但没有产出任何 .sig 更新包；请检查 tauri build 日志与 createUpdaterArtifacts 配置"
            exit 1
          fi
          uploaded=0
          for sig in "${sigs[@]}"; do
            echo "::notice::sig: ${sig#"$root"/}"
            bundle="${sig%.sig}"
            case "$bundle" in
              *.app.tar.gz) ;;
              *) continue ;;
            esac
            gh release upload "$TAG" "$bundle" "$sig" --clobber
            echo "uploaded $(basename "$bundle") and its signature"
            uploaded=$((uploaded + 1))
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::找到了 .sig 但没有 macOS 更新包（.app.tar.gz）"
            exit 1
          fi

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test manifest builder
        run: node scripts/build-updater-manifest.mjs --self-test

      - name: Publish updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: desktop-v${{ needs.prepare.outputs.version }}
          EXPECT_SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          OUTPUT_DIR=.update-manifests \
            node scripts/build-updater-manifest.mjs
          for file in .update-manifests/latest-local.json .update-manifests/latest-client.json; do
            if [ -f "$file" ]; then
              gh release upload "$RELEASE_TAG" "$file" --clobber
              echo "uploaded $(basename "$file")"
            fi
          done
