[package]
name = "agentgod-files-local"
version = "0.1.6"
edition = "2021"
description = "AgentGod Files desktop app: browse this machine and remote servers"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentgod-desktop-common = { path = "../common" }
agentgod-files = { path = "../.." }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
