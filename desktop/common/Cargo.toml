[package]
name = "agentgod-desktop-common"
version = "0.1.5"
edition = "2021"
description = "Shared runtime for the AgentGod Files desktop companions"
license = "MIT"

[dependencies]
agentgod-files = { path = "../.." }
anyhow = "1"
axum = "0.8"
bytes = "1"
dirs = "5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
