[package]
name = "agentgod-desktop-common"
version = "0.2.1"
edition = "2021"
description = "Shared runtime for the AgentGod Files desktop companions"
license = "MIT"

[dependencies]
agentgod-files = { path = "../.." }
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
dashmap = "6"
dirs = "5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
