[package]
name = "rockbadger-app"
version = "0.3.4"
edition = "2021"
description = "RockBadger desktop app: local files, RockBadger servers and SSH hosts in one window"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rockbadger-desktop-common = { path = "../common" }
rockbadger = { path = "../.." }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[[bin]]
name = "rockbadger"
path = "src/main.rs"
