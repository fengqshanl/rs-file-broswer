[package]
name = "agentgod-files-app"
version = "0.2.1"
edition = "2021"
description = "AgentGod Files desktop app: local files, AgentGod servers and SSH hosts in one window"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentgod-desktop-common = { path = "../common" }
agentgod-files = { path = "../.." }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
